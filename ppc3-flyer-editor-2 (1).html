<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC 3.0 — Add Your Photo</title>
<style>
  :root {
    --flame: #e8590c;
    --flame-bright: #ff8c2e;
    --gold: #f5a623;
    --ink: #1a0f0a;
    --cream: #fff8ef;
    --ember: #7a1f0a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #2a0f06 0%, #120402 60%, #000 100%);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
    max-width: 420px;
  }
  .header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--flame-bright);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 6px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .header p {
    font-size: 14px;
    color: #d9c4b5;
    margin: 0;
    line-height: 1.4;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1773 / 2255;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(245,166,35,0.15);
    background: #000;
    touch-action: none;
  }
  .stage img.base {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .photo-zone {
    position: absolute;
    /* circle x:476-1296 y:815-1635 in a 1773x2255 image.
       Sized as a % of width only, then forced square via aspect-ratio,
       so it stays a true circle no matter the stage's aspect ratio. */
    left: 26.85%;
    top: 36.14%;
    width: 46.25%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.04);
  }
  .photo-zone canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .photo-zone .placeholder {
    text-align: center;
    color: #8a8a8a;
    font-size: 12px;
    line-height: 1.5;
    padding: 0 20px;
    pointer-events: none;
  }
  .photo-zone .placeholder svg {
    width: 34px;
    height: 34px;
    margin-bottom: 6px;
    opacity: 0.6;
  }
  .photo-zone.has-image .placeholder { display: none; }
  .name-zone {
    position: absolute;
    /* box x:490-1290 y:1665-1785 */
    left: 27.64%;
    top: 73.84%;
    width: 45.18%;
    height: 5.32%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3%;
    pointer-events: none;
  }
  .name-zone span {
    font-weight: 800;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    letter-spacing: 0.01em;
  }
  .controls {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--flame-bright);
    margin-bottom: 6px;
  }
  .name-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid rgba(245,166,35,0.35);
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    outline: none;
  }
  .name-input::placeholder { color: #8a7468; }
  .name-input:focus { border-color: var(--gold); background: rgba(255,255,255,0.1); }

  .upload-btn, .download-btn, .reset-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .upload-btn {
    background: rgba(255,255,255,0.08);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.18);
  }
  .upload-btn:active { background: rgba(255,255,255,0.14); }
  .download-btn {
    background: linear-gradient(135deg, var(--flame-bright), var(--flame));
    color: #1a0f0a;
    box-shadow: 0 8px 20px rgba(232,89,12,0.35);
  }
  .download-btn:disabled {
    opacity: 0.4;
    box-shadow: none;
    cursor: not-allowed;
  }
  .download-btn:active:not(:disabled) { transform: translateY(1px); }
  .zoom-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .zoom-row input[type=range] {
    flex: 1;
    accent-color: var(--flame-bright);
  }
  .hint {
    font-size: 12px;
    color: #b89a89;
    text-align: center;
    margin-top: 4px;
    line-height: 1.5;
  }
  #fileInput { display: none; }
  .footer-note {
    margin-top: 28px;
    font-size: 11px;
    color: #6b5346;
    text-align: center;
    max-width: 380px;
  }
</style>
</head>

    <div class="photo-zone" id="photoZone">
      <canvas id="photoCanvas"></canvas>
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        Tap to add your photo
      </div>
    </div>
    <div class="name-zone" id="nameZone"><span id="nameDisplay"></span></div>
  </div>

  <div class="controls">
    <input type="file" id="fileInput" accept="image/*">
    <button class="upload-btn" id="uploadBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span id="uploadBtnText">Add your photo</span>
    </button>

    <div class="zoom-row" id="zoomRow" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b89a89" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="range" id="zoomSlider" min="100" max="300" value="100">
    </div>
    <div class="hint" id="dragHint" style="display:none;">Drag your photo to reposition it inside the circle</div>

    <div class="field">
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" class="name-input" placeholder="e.g. Daniella Etim" maxlength="34">
    </div>

    <button class="download-btn" id="downloadBtn" disabled>Download my flyer</button>
    <button class="upload-btn reset-btn" id="resetBtn" style="display:none;">Start over</button>
  </div>

  <div class="footer-note">Your photo is processed only on your own device — nothing is uploaded anywhere.</div>

<script>
const photoZone = document.getElementById('photoZone');
const photoCanvas = document.getElementById('photoCanvas');
const placeholder = document.getElementById('placeholder');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const uploadBtnText = document.getElementById('uploadBtnText');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const nameInput = document.getElementById('nameInput');
const nameDisplay = document.getElementById('nameDisplay');
const zoomSlider = document.getElementById('zoomSlider');
const zoomRow = document.getElementById('zoomRow');
const dragHint = document.getElementById('dragHint');
const baseImg = document.getElementById('baseImg');

let img = null;
let scale = 1, baseScale = 1;
let offsetX = 0, offsetY = 0;
let dragging = false, lastX = 0, lastY = 0;
let hasImage = false;

function resizeCanvas() {
  const rect = photoZone.getBoundingClientRect();
  photoCanvas.width = rect.width * 2;
  photoCanvas.height = rect.height * 2;
  drawPhoto();
}
window.addEventListener('resize', resizeCanvas);

function drawPhoto() {
  const ctx = photoCanvas.getContext('2d');
  const w = photoCanvas.width, h = photoCanvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!img) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(w/2, h/2, Math.min(w,h)/2, 0, Math.PI*2);
  ctx.clip();
  // Everything below is in canvas pixel space (w,h), not CSS pixel space,
  // so it matches photoCanvas's actual backing resolution.
  const minSide = Math.min(img.naturalWidth, img.naturalHeight);
  const coverScale = (Math.min(w, h) / minSide) * scale;
  const drawW = img.naturalWidth * coverScale;
  const drawH = img.naturalHeight * coverScale;
  const cx = w/2 + offsetX;
  const cy = h/2 + offsetY;
  ctx.drawImage(img, cx - drawW/2, cy - drawH/2, drawW, drawH);
  ctx.restore();
}

function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const tempImg = new Image();
    tempImg.onload = () => {
      img = tempImg;
      scale = 1;
      offsetX = 0; offsetY = 0;
      hasImage = true;
      photoZone.classList.add('has-image');
      zoomSlider.value = 100;
      zoomRow.style.display = 'flex';
      dragHint.style.display = 'block';
      uploadBtnText.textContent = 'Change photo';
      resetBtn.style.display = 'block';
      resizeCanvas();
      checkReady();
    };
    tempImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

uploadBtn.addEventListener('click', () => fileInput.click());
photoZone.addEventListener('click', (e) => { if (!hasImage) fileInput.click(); });
fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) loadImageFile(e.target.files[0]);
});

zoomSlider.addEventListener('input', () => {
  scale = zoomSlider.value / 100;
  drawPhoto();
});

function startDrag(x, y) {
  if (!hasImage) return;
  dragging = true; lastX = x; lastY = y;
}
function moveDrag(x, y) {
  if (!dragging) return;
  const rect = photoCanvas.getBoundingClientRect();
  const pxRatio = photoCanvas.width / rect.width;
  offsetX += (x - lastX) * pxRatio;
  offsetY += (y - lastY) * pxRatio;
  lastX = x; lastY = y;
  drawPhoto();
}
function endDrag() { dragging = false; }

photoCanvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);
photoCanvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0]; startDrag(t.clientX, t.clientY);
}, {passive: true});
photoCanvas.addEventListener('touchmove', (e) => {
  const t = e.touches[0]; moveDrag(t.clientX, t.clientY);
  e.preventDefault();
}, {passive: false});
photoCanvas.addEventListener('touchend', endDrag);

nameInput.addEventListener('input', () => {
  nameDisplay.textContent = nameInput.value.toUpperCase();
  checkReady();
});

function checkReady() {
  downloadBtn.disabled = !(hasImage && nameInput.value.trim().length > 0);
}

resetBtn.addEventListener('click', () => {
  img = null; hasImage = false;
  photoZone.classList.remove('has-image');
  zoomRow.style.display = 'none';
  dragHint.style.display = 'none';
  uploadBtnText.textContent = 'Add your photo';
  resetBtn.style.display = 'none';
  drawPhoto();
  checkReady();
});

downloadBtn.addEventListener('click', () => {
  // Render final composite at full base image resolution
  const outCanvas = document.createElement('canvas');
  const W = baseImg.naturalWidth, H = baseImg.naturalHeight;
  outCanvas.width = W; outCanvas.height = H;
  const ctx = outCanvas.getContext('2d');
  ctx.drawImage(baseImg, 0, 0, W, H);

  // Circle geometry in original px (from analysis)
  const cx0 = 476, cy0 = 815, csize = 820;
  const ccx = cx0 + csize/2, ccy = cy0 + csize/2, cr = csize/2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(ccx, ccy, cr, 0, Math.PI*2);
  ctx.clip();

  // offsetX/offsetY are tracked in photoCanvas pixel space; convert to
  // output image pixel space (csize) by scaling proportionally.
  const pxPerCanvasPx = csize / Math.min(photoCanvas.width, photoCanvas.height);
  const minSide = Math.min(img.naturalWidth, img.naturalHeight);
  const coverScale = (csize / minSide) * scale;
  const drawW = img.naturalWidth * coverScale;
  const drawH = img.naturalHeight * coverScale;
  const drawCx = ccx + offsetX * pxPerCanvasPx;
  const drawCy = ccy + offsetY * pxPerCanvasPx;
  ctx.drawImage(img, drawCx - drawW/2, drawCy - drawH/2, drawW, drawH);
  ctx.restore();

  // Name text in box: x:490-1290 y:1665-1785
  const boxX = 490, boxY = 1665, boxW = 800, boxH = 120;
  ctx.save();
  ctx.font = "700 64px -apple-system, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 10;
  let name = nameInput.value.trim().toUpperCase();
  // shrink font if too wide
  let fontSize = 64;
  ctx.font = `700 ${fontSize}px -apple-system, Arial, sans-serif`;
  while (ctx.measureText(name).width > boxW - 40 && fontSize > 24) {
    fontSize -= 2;
    ctx.font = `700 ${fontSize}px -apple-system, Arial, sans-serif`;
  }
  ctx.fillText(name, boxX + boxW/2, boxY + boxH/2);
  ctx.restore();

  outCanvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = nameInput.value.trim().replace(/[^a-z0-9]+/gi, '_') || 'flyer';
    a.download = `PPC3.0_${safeName}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/jpeg', 0.95);
});

baseImg.addEventListener('load', resizeCanvas);
if (baseImg.complete) resizeCanvas();
checkReady();
</script>
